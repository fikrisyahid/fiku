[project]
name = "fana-ops"
version = "0.1.0"
description = "Operations and workflow management for Fana"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1.7",
    "rich>=13.7.1",
    "python-dotenv>=1.0.1",
]

[project.scripts]
fana = "workflow:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
